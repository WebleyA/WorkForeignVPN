
services:
  l2tp-vless:
    build: .
    image: local/l2tp-vless-proxy:latest
    container_name: l2tp-vless-proxy
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      VLESS_PORT: ${VLESS_PORT:-1081}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/ppp:/dev/ppp
    ports:
      - "127.0.0.1:${VLESS_PORT:-1081}:1081/tcp"
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    stop_grace_period: 15s
